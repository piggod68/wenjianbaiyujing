<svg viewBox="0 0 1000 620" role="img" aria-labelledby="title desc" xmlns="http://www.w3.org/2000/svg"><title id="title">鹈鹕骑着自行车</title><desc id="desc">海边晴朗的午后，一只戴着小帽子的鹈鹕正踩着自行车前进。</desc>
