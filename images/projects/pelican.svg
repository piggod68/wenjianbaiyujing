<g opacity=".5" fill="#fff5d7"><path d="M127 392h76" stroke="#fff5d7" stroke-width="3"/><path d="M784 344h54" stroke="#fff5d7" stroke-width="3"/><path d="M520 430h95" stroke="#fff5d7" stroke-width="3"/></g>
