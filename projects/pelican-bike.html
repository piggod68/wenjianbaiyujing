<title>鹈鹕骑行记 · SVG 动画</title>
<style>
:root{--ink:#173b45;--teal:#397a78;--coral:#ef8968;--sun:#f6c76c;--cream:#fff8e9}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#e7f0e9;color:var(--ink);font-family:"Segoe UI","Microsoft YaHei",sans-serif;overflow:hidden}
.scene{width:min(1100px,100vw);padding:28px 32px 24px}.card{position:relative;overflow:hidden;border-radius:28px;background:var(--cream);box-shadow:0 24px 70px #294e4826;border:1px solid #ffffffaa}
header{position:absolute;z-index:2;left:42px;top:32px}.eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#67908a;font-weight:700}h1{font-family:Georgia,"Noto Serif SC",serif;font-size:clamp(24px,4vw,42px);font-weight:500;letter-spacing:.04em;margin:8px 0 4px}.sub{font-size:13px;color:#6e8c85;letter-spacing:.08em}
svg{display:block;width:100%;height:auto}.cloud{animation:drift 15s ease-in-out infinite alternate}.cloud.c2{animation-delay:-7s}.wheel{transform-box:fill-box;transform-origin:center;animation:spin 2s linear infinite}.pedal{transform-box:fill-box;transform-origin:center;animation:spin 2s linear infinite}.rider{transform-box:fill-box;transform-origin:55% 80%;animation:bob .5s ease-in-out infinite alternate}.beak{transform-box:fill-box;transform-origin:left center;animation:beak 3.5s ease-in-out infinite}.grass{animation:sway 2.8s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:bottom center}.grass.g2{animation-delay:-1.4s}.sun{transform-box:fill-box;transform-origin:center;animation:pulse 5s ease-in-out infinite alternate}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes bob{to{transform:translateY(-3px) rotate(-1deg)}}@keyframes drift{to{transform:translateX(24px)}}@keyframes beak{0%,78%,100%{transform:rotate(0)}84%{transform:rotate(-3deg)}90%{transform:rotate(2deg)}}@keyframes sway{to{transform:rotate(7deg)}}@keyframes pulse{to{transform:scale(1.06)}}
footer{position:absolute;bottom:19px;left:0;right:0;text-align:center;font-size:11px;letter-spacing:.2em;color:#719087}.badge{position:absolute;right:30px;top:31px;border:1px solid #abc7b7;border-radius:99px;padding:8px 13px;color:#63867c;font-size:11px;letter-spacing:.12em}.motion{position:absolute;right:36px;bottom:40px;width:64px;height:1px;background:#edb49a;box-shadow:10px -9px 0 -0.3px #edb49a,18px 8px 0 -0.3px #edb49a;opacity:.8}
@media(max-width:600px){.scene{padding:12px}.card{border-radius:18px}header{left:22px;top:20px}.badge{right:16px;top:18px;font-size:9px}footer{bottom:10px;font-size:9px}.motion{right:15px;bottom:25px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important}}
.portfolio-back{position:fixed;top:18px;left:20px;z-index:10;color:#365a52;background:#fff8e9e6;border:1px solid #abc7b7;padding:9px 14px;border-radius:20px;text-decoration:none;font-size:11px;backdrop-filter:blur(10px)}
</style>
</head>
